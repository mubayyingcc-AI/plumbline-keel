name: Plumbline Keel CI
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual verification reason'
        required: false
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
