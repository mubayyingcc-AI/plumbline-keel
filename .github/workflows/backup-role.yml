name: RLS-aware backup identity
on:
  pull_request:
    paths:
      - "db/migrations/020_rls_aware_backup_identity.sql"
      - "test/backup-role.integration.test.js"
      - "test/fixtures/backup-role-fixture.sql"
      - ".github/workflows/backup-role.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/020_rls_aware_backup_identity.sql"
      - "test/backup-role.integration.test.js"
      - "test/fixtures/backup-role-fixture.sql"
      - ".github/workflows/backup-role.yml"
permissions:
  contents: read
jobs:
  backup-role:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keel_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keel_backup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KEEL_BACKUP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/keel_backup_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify least-privilege backup identity and RLS
        run: |
          mkdir -p "$RUNNER_TEMP/pg-bin"
          cat > "$RUNNER_TEMP/pg-bin/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          shift
          exec docker run --rm --network host -e PGPASSWORD=postgres postgres:18-bookworm psql -X -h 127.0.0.1 -U postgres -d keel_backup_ci "$@"
          SH
          cat > "$RUNNER_TEMP/pg-bin/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          skip=0
          for arg in "$@"; do
            if (( skip )); then skip=0; continue; fi
            if [[ "$arg" == "--dbname" ]]; then skip=1; continue; fi
            if [[ "$arg" == --dbname=* ]]; then continue; fi
            args+=("$arg")
          done
          exec docker run --rm --network host -e PGPASSWORD=postgres -e "PGOPTIONS=${PGOPTIONS:-}" postgres:18-bookworm pg_dump --dbname=postgresql://postgres:postgres@127.0.0.1:5432/keel_backup_ci "${args[@]}"
          SH
          chmod +x "$RUNNER_TEMP/pg-bin/"*
          echo "$RUNNER_TEMP/pg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/pg-bin:$PATH"
          node --test test/backup-role.integration.test.js
