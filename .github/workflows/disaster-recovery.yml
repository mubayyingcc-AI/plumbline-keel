name: Keel disaster recovery verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/production-disaster-recovery-foundation', 'feat/keel-dr-backup-restore-controls']

permissions:
  contents: read

jobs:
  encrypted-backup-restore:
    name: Encrypted PostgreSQL 18 backup and restore
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keel_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keel_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGSSLMODE: disable
      KEEL_BACKUP_S3_BUCKET: keel-ci-backups
      KEEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
      KEEL_BACKUP_S3_REGION: us-east-1
      KEEL_BACKUP_ALLOW_INSECURE_TEST_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testpassword
      AWS_DEFAULT_REGION: us-east-1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/keel_source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL 18 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 age python3-pip
          sudo python3 -m pip install --break-system-packages awscli
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Validate shell syntax
        run: |
          bash -n scripts/backup-postgres-encrypted.sh
          bash -n scripts/restore-postgres-encrypted.sh
      - name: Prepare synthetic source database and isolated restore target
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE TABLE dr_probe (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO dr_probe VALUES (1, 'keel-dr-proof');"
          createdb -h 127.0.0.1 -U postgres -e keel_restore_ci
        env:
          PGPASSWORD: postgres
      - name: Create isolated S3-compatible test bucket
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          docker run -d --name keel-s3-test -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=test -e MINIO_ROOT_PASSWORD=testpassword \
            ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ":9001"
          trap 'docker logs keel-s3-test 2>&1 | tail -n 200 || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            code="$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)"
            if [[ "$code" != "000" && -n "$code" ]]; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]] || { docker logs keel-s3-test; exit 1; }
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://keel-ci-backups
          aws --endpoint-url http://127.0.0.1:9000 s3 ls s3://keel-ci-backups
      - name: Generate ephemeral test encryption identity
        id: age
        run: |
          age-keygen -o "$RUNNER_TEMP/age-identity.txt"
          chmod 600 "$RUNNER_TEMP/age-identity.txt"
          RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/age-identity.txt")"
          test -n "$RECIPIENT"
          echo "recipient=$RECIPIENT" >> "$GITHUB_OUTPUT"
      - name: Create encrypted backup
        env:
          KEEL_BACKUP_DIR: ${{ runner.temp }}/keel-backups
          KEEL_BACKUP_AGE_RECIPIENT: ${{ steps.age.outputs.recipient }}
          KEEL_BACKUP_DATABASE_ID: ci-source
        run: bash scripts/backup-postgres-encrypted.sh
      - name: Verify remote backup artifacts
        run: |
          count="$(aws --endpoint-url http://127.0.0.1:9000 s3 ls s3://keel-ci-backups/keel/ci-source/ --recursive | wc -l)"
          test "$count" -eq 3
      - name: Verify backup metadata and restore into clean database
        env:
          KEEL_BACKUP_AGE_IDENTITY_FILE: ${{ runner.temp }}/age-identity.txt
          KEEL_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/keel_restore_ci
          KEEL_RESTORE_CONFIRM: RESTORE_TO_EMPTY_DATABASE
          KEEL_RESTORE_EXPECTED_DATABASE_ID: ci-source
          PGPASSWORD: postgres
        run: |
          remote_dir="$RUNNER_TEMP/keel-remote-roundtrip"
          mkdir -p "$remote_dir"
          aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 cp --recursive s3://keel-ci-backups/keel/ci-source/ "$remote_dir/"
          backup_file="$(find "$remote_dir" -type f -name '*.dump.age' -print -quit)"
          test -n "$backup_file"
          test -s "$backup_file.manifest.json"
          node -e 'const fs=require("node:fs"),c=require("node:crypto");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const b=fs.readFileSync(process.argv[2]);if(m.sha256!==c.createHash("sha256").update(b).digest("hex")||m.databaseId!=="ci-source")process.exit(1)' "$backup_file.manifest.json" "$backup_file"
          export KEEL_BACKUP_FILE="$backup_file"
          bash scripts/restore-postgres-encrypted.sh
          restored="$(psql "$KEEL_RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT value FROM dr_probe WHERE id=1")"
          test "$restored" = "keel-dr-proof"
          echo "Encrypted backup and isolated restore passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed when tenant RLS is present
        env:
          KEEL_BACKUP_DIR: ${{ runner.temp }}/keel-backups-rls-guard
          KEEL_BACKUP_AGE_RECIPIENT: ${{ steps.age.outputs.recipient }}
          KEEL_BACKUP_DATABASE_ID: ci-source
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE TABLE public.dr_rls_guard (tenant_id uuid NOT NULL, payload text NOT NULL); ALTER TABLE public.dr_rls_guard ENABLE ROW LEVEL SECURITY; ALTER TABLE public.dr_rls_guard FORCE ROW LEVEL SECURITY; CREATE POLICY dr_rls_guard_tenant ON public.dr_rls_guard USING (tenant_id = NULLIF(current_setting('keel.tenant_id',true),'')::uuid) WITH CHECK (tenant_id = NULLIF(current_setting('keel.tenant_id',true),'')::uuid);"
          set +e
          output="$(bash scripts/backup-postgres-encrypted.sh 2>&1)"
          status=$?
          set -e
          [[ "$status" -eq 78 ]] || { printf '%s\\n' "$output"; echo "expected RLS backup guard exit 78, got $status" >&2; exit 1; }
          grep -q "backup_blocked_rls_requires_consistent_tenant_snapshot_export" <<< "$output"
          echo "RLS backup fail-closed guard passed." >> "$GITHUB_STEP_SUMMARY"

  pgbackrest-point-in-time-recovery:
    name: S3-backed PostgreSQL 18 point-in-time recovery
    runs-on: ubuntu-24.04
    env:
      PGDATA: /var/lib/postgresql/18/main
      PGCONF: /etc/postgresql/18/main/postgresql.conf
      PGUSER: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGPASSWORD: postgres
      PGBACKREST_REPO1_S3_BUCKET: keel-ci-backups
      PGBACKREST_REPO1_S3_ENDPOINT: 127.0.0.1:9000
      PGBACKREST_REPO1_S3_REGION: us-east-1
      PGBACKREST_REPO1_S3_KEY: test
      PGBACKREST_REPO1_S3_KEY_SECRET: testpassword
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testpassword
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 server and pgBackRest
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18 pgbackrest python3-pip
          sudo python3 -m pip install --break-system-packages awscli
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          sudo pg_createcluster 18 main --start
          sudo -u postgres psql -p 5433 -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
      - name: Start TLS-verified S3-compatible test service and create disposable bucket
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          cert_dir="$RUNNER_TEMP/minio-certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$cert_dir/private.key" -out "$cert_dir/public.crt" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          chmod 600 "$cert_dir/private.key"
          sudo install -m 0644 "$cert_dir/public.crt" /usr/local/share/ca-certificates/keel-test-ca.crt
          sudo update-ca-certificates
          docker run -d --name keel-s3-test -p 9000:9000 -p 9001:9001 \
            -v "$cert_dir:/certs:ro" \
            -e MINIO_ROOT_USER=test -e MINIO_ROOT_PASSWORD=testpassword \
            ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --certs-dir /certs --console-address ":9001"
          export AWS_CA_BUNDLE=/usr/local/share/ca-certificates/keel-test-ca.crt
          echo "AWS_CA_BUNDLE=/usr/local/share/ca-certificates/keel-test-ca.crt" >> "$GITHUB_ENV"
          echo "PGBACKREST_REPO1_STORAGE_CA_FILE=/usr/local/share/ca-certificates/keel-test-ca.crt" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 45); do
            code="$(curl --cacert /usr/local/share/ca-certificates/keel-test-ca.crt --max-time 2 -s -o /dev/null -w '%{http_code}' https://127.0.0.1:9000/ || true)"
            if [[ "$code" != "000" && -n "$code" ]]; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]] || { docker logs keel-s3-test; exit 1; }
          aws --endpoint-url https://127.0.0.1:9000 s3 mb s3://keel-ci-backups
          aws --endpoint-url https://127.0.0.1:9000 s3 ls s3://keel-ci-backups
      - name: Execute full backup, WAL archive and named restore-point test
        run: |
          bash -n scripts/ci-pgbackrest-pitr.sh
          sudo --preserve-env=PGDATA,PGCONF,PGUSER,PGHOST,PGPORT,PGPASSWORD,PGBACKREST_REPO1_S3_BUCKET,PGBACKREST_REPO1_S3_ENDPOINT,PGBACKREST_REPO1_S3_REGION,PGBACKREST_REPO1_S3_KEY,PGBACKREST_REPO1_S3_KEY_SECRET,PGBACKREST_REPO1_STORAGE_CA_FILE,PATH bash scripts/ci-pgbackrest-pitr.sh
          echo "S3-backed PostgreSQL 18 PITR restore-point assertions passed." >> "$GITHUB_STEP_SUMMARY"
