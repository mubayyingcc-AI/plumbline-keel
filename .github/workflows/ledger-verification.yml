name: Keel ledger verification

on:
  pull_request:
    branches: [main, 'security/**']
  push:
    branches:
      - main
      - 'ledger/**'
      - 'security/**'
      - 'provider/**'

permissions:
  contents: read

jobs:
  ledger:
    name: PostgreSQL ${{ matrix.postgres-version }} ledger verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/keel_test
      PGSSLMODE: disable
      KEEL_LEDGER_TEST_DATABASE_URL: postgresql://keel_runtime:keel_runtime_test@localhost:5432/keel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply ledger migrations and verify restricted runtime role
        env:
          KEEL_MIGRATION_TARGET: ci
          KEEL_RUNTIME_DB_PASSWORD: keel_runtime_test
        run: node scripts/apply-ledger-migrations.js
      - name: Run unit and PostgreSQL integration tests
        run: npm test
      - name: Verify tenant-scoped restored-state projections and ledger event chains
        env:
          KEEL_RECOVERY_TARGET: isolated
          DATABASE_URL: postgresql://keel_runtime:keel_runtime_test@localhost:5432/keel_test
        run: node scripts/verify-recovery-state.js
